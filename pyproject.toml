[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yidao-ops-agent"
version = "1.0.0"
description = "易道 · 以易理为方法论内核的算子开发 Agent：声明式表达式树、独立语义基准、选手与裁判分离的评测契约、多后端 AscendC 代码合成"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "易道贡献者" },
]
keywords = ["AscendC", "CANN", "算子开发", "operator", "code-generation", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/J-0201/yidao-ops-agent"
Repository = "https://github.com/J-0201/yidao-ops-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yidao = ["cann_stub/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
